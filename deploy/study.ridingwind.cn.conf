server {
    listen 80;
    listen [::]:80;
    server_name study.ridingwind.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name study.ridingwind.cn;

    ssl_certificate     /etc/letsencrypt/live/study.ridingwind.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/study.ridingwind.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /var/www/pinyin-hanzi-app;
    index index.html;

    access_log /var/log/nginx/study.ridingwind.cn.access.log;
    error_log  /var/log/nginx/study.ridingwind.cn.error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(mp3|js|css|png|jpg|jpeg|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;
}
